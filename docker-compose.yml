services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-octopus_video}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-octopus_video}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  psop-realize-api:
    restart: unless-stopped
    build: .
    image: psop-realize:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      VIDEO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-octopus_video}
      STORAGE_BACKEND: minio
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-servforce-materials}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_SECURE: "false"
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_OPENAI_BASE_URL: ${MODEL_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen3.7-plus}
      QWEN_TEXT_TEMPERATURE: ${QWEN_TEXT_TEMPERATURE:-0.1}
      QWEN_TEXT_TOP_P: ${QWEN_TEXT_TOP_P:-0.8}
      QWEN_TEXT_MAX_TOKENS: ${QWEN_TEXT_MAX_TOKENS:-24000}
      QWEN_TEXT_TIMEOUT_SECONDS: ${QWEN_TEXT_TIMEOUT_SECONDS:-1800}
      QWEN_TEXT_MAX_INPUT_CHARS: ${QWEN_TEXT_MAX_INPUT_CHARS:-600000}
      TRANSCRIPT_STRUCTURE_MODEL: ${TRANSCRIPT_STRUCTURE_MODEL:-qwen3.7-plus}
      LOCAL_ASR_API_BASE_URL: ${LOCAL_ASR_API_BASE_URL:-}
      LOCAL_ASR_LANGUAGE: ${LOCAL_ASR_LANGUAGE:-zh}
      LOCAL_ASR_TIMEOUT_SECONDS: ${LOCAL_ASR_TIMEOUT_SECONDS:-3600}
      LOCAL_ASR_MAX_RETRIES: ${LOCAL_ASR_MAX_RETRIES:-1}
      LOCAL_ASR_MODEL_LABEL: ${LOCAL_ASR_MODEL_LABEL:-Qwen/Qwen3-ASR-1.7B}
      VIDEO_WORKDIR: /app/work/videos
      VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-2147483648}
      VIDEO_MAX_ANALYZED_FRAMES: ${VIDEO_MAX_ANALYZED_FRAMES:-120}
      VIDEO_FRAME_SELECTION_MIN_BLUR_SCORE: ${VIDEO_FRAME_SELECTION_MIN_BLUR_SCORE:-25}
      VIDEO_FRAME_SELECTION_DARK_RATIO_THRESHOLD: ${VIDEO_FRAME_SELECTION_DARK_RATIO_THRESHOLD:-0.9}
      VIDEO_FRAME_SELECTION_BRIGHT_RATIO_THRESHOLD: ${VIDEO_FRAME_SELECTION_BRIGHT_RATIO_THRESHOLD:-0.9}
      VIDEO_FRAME_SELECTION_MIN_MEAN_BRIGHTNESS: ${VIDEO_FRAME_SELECTION_MIN_MEAN_BRIGHTNESS:-8}
      VIDEO_FRAME_SELECTION_MAX_MEAN_BRIGHTNESS: ${VIDEO_FRAME_SELECTION_MAX_MEAN_BRIGHTNESS:-248}
      VIDEO_ANALYSIS_PROXY_HEIGHT: ${VIDEO_ANALYSIS_PROXY_HEIGHT:-720}
      VIDEO_ANALYSIS_PROXY_CRF: ${VIDEO_ANALYSIS_PROXY_CRF:-28}
      VIDEO_ANALYSIS_PROXY_PRESET: ${VIDEO_ANALYSIS_PROXY_PRESET:-medium}
      VIDEO_ANALYSIS_PROXY_AUDIO_BITRATE: ${VIDEO_ANALYSIS_PROXY_AUDIO_BITRATE:-128k}
      VIDEO_DENSE_FRAME_INTERVAL_SECONDS: ${VIDEO_DENSE_FRAME_INTERVAL_SECONDS:-2}
      VIDEO_SCENE_CHANGE_FRAME_ENABLED: ${VIDEO_SCENE_CHANGE_FRAME_ENABLED:-true}
      VIDEO_SCENE_CHANGE_THRESHOLD: ${VIDEO_SCENE_CHANGE_THRESHOLD:-0.25}
      VIDEO_CANDIDATE_FRAME_MIN_SPACING_MS: ${VIDEO_CANDIDATE_FRAME_MIN_SPACING_MS:-500}
      VIDEO_DEDUP_TIME_WINDOW_SECONDS: ${VIDEO_DEDUP_TIME_WINDOW_SECONDS:-10}
      VIDEO_DEDUP_HSV_SIMILARITY_THRESHOLD: ${VIDEO_DEDUP_HSV_SIMILARITY_THRESHOLD:-0.92}
      VIDEO_DEDUP_PHASH_DISTANCE_THRESHOLD: ${VIDEO_DEDUP_PHASH_DISTANCE_THRESHOLD:-6}
      VIDEO_GRAPH_INDEX_DEVICE: ${VIDEO_GRAPH_INDEX_DEVICE:-cpu}
      VIDEO_GRAPH_INDEX_FINETUNED_YOLO_WORLD_MODEL: ${VIDEO_GRAPH_INDEX_FINETUNED_YOLO_WORLD_MODEL:-/app/runs/yolo_world/robot_arm_parts_v1/weights/best.pt}
      VIDEO_GRAPH_INDEX_MOBILE_SAM_MODEL: ${VIDEO_GRAPH_INDEX_MOBILE_SAM_MODEL:-/models/sam2.1_b.pt}
      VIDEO_GRAPH_INDEX_YOLO_WORLD_CONFIDENCE: ${VIDEO_GRAPH_INDEX_YOLO_WORLD_CONFIDENCE:-0.10}
      VIDEO_GRAPH_INDEX_YOLO_WORLD_IOU: ${VIDEO_GRAPH_INDEX_YOLO_WORLD_IOU:-0.35}
      VIDEO_GRAPH_INDEX_YOLO_WORLD_MAX_DET: ${VIDEO_GRAPH_INDEX_YOLO_WORLD_MAX_DET:-12}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
    volumes:
      - octopus_work:/app/work
      - ${PSOP_REALIZE_MODEL_DIR:-./models}:/models:ro
    ports:
      - "${PSOP_REALIZE_API_PORT:-8090}:8090"
    command: ["python", "-m", "uvicorn", "app.video_main:app", "--host", "0.0.0.0", "--port", "8090"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10

  psop-realize-mcp:
    restart: unless-stopped
    build: .
    image: psop-realize:latest
    depends_on:
      psop-realize-api:
        condition: service_healthy
    environment:
      PSOP_REALIZE_VIDEO_API_BASE_URL: http://psop-realize-api:8090
      PSOP_REALIZE_VIDEO_PUBLIC_BASE_URL: ${PSOP_REALIZE_VIDEO_PUBLIC_BASE_URL:-http://127.0.0.1:8090}
      PSOP_REALIZE_MCP_TRANSPORT: streamable-http
      PSOP_REALIZE_MCP_HOST: 0.0.0.0
      PSOP_REALIZE_MCP_PORT: 8100
      PSOP_REALIZE_MCP_PATH: ${PSOP_REALIZE_MCP_PATH:-/mcp}
      PSOP_REALIZE_MCP_BEARER_TOKEN: ${PSOP_REALIZE_MCP_BEARER_TOKEN:-}
    ports:
      - "${PSOP_REALIZE_MCP_PORT:-8100}:8100"
    command: ["python", "-m", "app.mcp_server"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  octopus_work:
