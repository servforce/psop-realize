<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servforce Material Workbench</title>
    <link rel="stylesheet" href="/static/assets/style.css?v=20260824-sidebar-cleanup-v1" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">Servforce Workbench</div>
      <button data-view="videos">视频</button>
      <button data-view="standardSearch">标准工作台</button>
      <button data-view="logs">调用记录</button>
    </aside>
    <main>
      <header>
        <h1>材料工作台</h1>
        <p>视频分析、标准检索与产物管理。</p>
      </header>
      <section id="videos" class="view">
        <div class="video-workspace" data-video-view="directory">
          <div class="video-directory-page">
            <div class="video-directory-panel">
              <h2 class="video-panel-title">上传视频</h2>
              <div class="video-upload" id="dropZone">
                <input id="videoFile" class="hidden" type="file" accept="video/*,.mp4,.mov,.webm,.m4v,.mkv" />
                <svg class="upload-cloud" viewBox="0 0 96 72" aria-hidden="true">
                  <path d="M30 58h38c11 0 20-8 20-19s-9-19-20-19h-1C64 9 54 2 43 2 29 2 18 13 18 27v2C8 31 2 38 2 48c0 6 4 10 12 10h16Z" />
                  <path class="upload-cloud-arrow" d="M48 24 31 43h11v18h12V43h11L48 24Z" />
                </svg>
                <div class="muted">点击上传，或将视频拖拽到此区域</div>
                <button id="uploadVideo" class="upload-primary" type="button">上传视频</button>
              </div>
              <div id="uploadInfo" class="muted">等待选择视频。</div>
              <div class="progress"><div id="uploadProgressBar"></div></div>
              <h2 class="video-panel-title video-directory-title">视频目录</h2>
              <div class="video-directory-tools">
                <div class="video-search-box">
                  <div class="video-search-input-wrap">
                    <input id="videoSearch" class="video-search" placeholder="输入视频标题关键词" />
                    <button id="videoSearchClear" class="search-clear-button hidden" type="button" aria-label="清空搜索">
                      <svg viewBox="0 0 20 20" aria-hidden="true">
                        <path d="m6.5 6.5 7 7m0-7-7 7" />
                      </svg>
                    </button>
                  </div>
                  <button id="videoSearchButton" class="search-icon-button" type="button" aria-label="搜索视频">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="7" />
                      <path d="m16.5 16.5 4 4" />
                    </svg>
                  </button>
                </div>
                <button id="videoLatestUpload" class="secondary sort-button" type="button">按最新时间排序</button>
              </div>
              <div id="videoList" class="list video-list"></div>
            </div>
          </div>
          <div class="video-analysis-page hidden">
            <div class="video-analysis-titlebar">
              <button id="backToVideoDirectory" class="secondary video-back-button" type="button">返回视频目录</button>
              <h2 class="video-panel-title">视频分析</h2>
            </div>
            <div id="videoProgressPanel" class="panel video-analysis-panel">
              <div class="empty">请选择视频查看分析进度与产物。</div>
            </div>
          </div>
        </div>
      </section>

      <section id="standardSearch" class="view">
        <div class="standard-search-workspace" data-standard-search-view="home">
          <div class="standard-search-home-page">
            <div class="search-workspace standard-search-panel standard-search-controls">
              <h2 class="video-panel-title">标准检索</h2>
              <div class="video-search-box standard-query-box">
                <div class="video-search-input-wrap">
                  <input id="standardSearchText" class="video-search" placeholder="输入作业场景、对象、工序或风险点" />
                </div>
                <button id="searchStandards" class="search-icon-button standard-query-submit" type="button" aria-label="检索标准">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m16.5 16.5 4 4" />
                  </svg>
                  <span>检索</span>
                </button>
              </div>
            </div>
          </div>
          <div class="standard-search-result-page hidden">
            <div class="standard-search-result-titlebar">
              <button id="backToStandardSearchHome" class="secondary standard-search-back-button" type="button">返回标准检索</button>
              <h2 class="video-panel-title">检索结果</h2>
            </div>
            <div class="search-workspace standard-search-panel standard-search-results">
              <div class="video-search-box standard-query-box">
                <div class="video-search-input-wrap">
                  <input id="standardSearchResultText" class="video-search" placeholder="输入作业场景、对象、工序或风险点" />
                </div>
                <button id="searchStandardsFromResult" class="search-icon-button standard-query-submit" type="button" aria-label="检索标准">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m16.5 16.5 4 4" />
                  </svg>
                  <span>检索</span>
                </button>
              </div>
              <div id="standardSearchResult" class="panel standard-search-result-panel">暂无检索结果</div>
            </div>
          </div>
        </div>
      </section>

      <section id="logs" class="view">
        <div id="logList" class="table-wrap"></div>
      </section>
    </main>
    <script src="/static/assets/app.js?v=20260824-sidebar-cleanup-v1"></script>
  </body>
</html>
