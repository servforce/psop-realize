<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servforce Material Workbench</title>
    <link rel="stylesheet" href="/static/assets/style.css?v=20260720-model-detail-links" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">Servforce Workbench</div>
      <button data-view="videos" class="active">视频</button>
      <button data-view="standards">标准库</button>
      <button data-view="standardSearch">标准库检索</button>
      <button data-view="logs">调用记录</button>
    </aside>
    <main>
      <header>
        <h1>材料工作台</h1>
        <p>视频分析、标准检索与产物管理。</p>
      </header>

      <section id="videos" class="view active">
        <div class="video-workspace" data-video-view="directory">
          <div class="video-directory-page">
            <div class="video-directory-panel">
              <h2 class="video-panel-title">上传视频</h2>
              <div class="video-upload" id="dropZone">
                <input id="videoFile" class="hidden" type="file" accept="video/*,.mp4,.mov,.webm,.m4v,.mkv" />
                <svg class="upload-cloud" viewBox="0 0 96 72" aria-hidden="true">
                  <path d="M30 58h38c11 0 20-8 20-19s-9-19-20-19h-1C64 9 54 2 43 2 29 2 18 13 18 27v2C8 31 2 38 2 48c0 6 4 10 12 10h16Z" />
                  <path class="upload-cloud-arrow" d="M48 24 31 43h11v18h12V43h11L48 24Z" />
                </svg>
                <div class="muted">点击上传或将视频拖拽到此区域</div>
                <button id="uploadVideo" class="upload-primary">上传视频</button>
              </div>
              <div id="uploadInfo" class="muted">等待选择视频。</div>
              <div class="progress"><div id="uploadProgressBar"></div></div>
              <h2 class="video-panel-title video-directory-title">视频目录</h2>
              <div class="video-directory-tools">
                <div class="video-search-box">
                  <div class="video-search-input-wrap">
                    <input id="videoSearch" class="video-search" placeholder="输入视频标题关键词" />
                    <button id="videoSearchClear" class="search-clear-button hidden" type="button" aria-label="清空搜索">
                      <svg viewBox="0 0 20 20" aria-hidden="true">
                        <path d="m6.5 6.5 7 7m0-7-7 7" />
                      </svg>
                    </button>
                  </div>
                  <button id="videoSearchButton" class="search-icon-button" type="button" aria-label="搜索视频">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="7" />
                      <path d="m16.5 16.5 4 4" />
                    </svg>
                  </button>
                </div>
                <button id="videoLatestUpload" class="secondary sort-button" type="button">按最新时间排序</button>
              </div>
              <div id="videoList" class="list video-list"></div>
            </div>
          </div>
          <div class="video-analysis-page hidden">
            <div class="video-analysis-titlebar">
              <button id="backToVideoDirectory" class="secondary video-back-button" type="button">返回视频目录</button>
              <h2 class="video-panel-title">视频分析</h2>
            </div>
            <div id="videoProgressPanel" class="panel video-analysis-panel">
              <div class="empty">请选择视频查看分析进度与产物</div>
            </div>
          </div>
        </div>
      </section>

      <section id="standards" class="view">
        <div class="standard-workspace" data-standard-view="directory">
          <div class="standard-directory-page">
            <div class="video-directory-panel">
              <h2 class="video-panel-title">上传标准</h2>
              <div class="video-upload standard-upload" id="standardDropZone">
                <input id="standardFiles" class="hidden" type="file" accept="application/pdf,.pdf" multiple />
                <svg class="standard-upload-folder" viewBox="0 0 112 78" aria-hidden="true">
                  <path class="standard-folder-tab" d="M14 18c0-4 3-7 7-7h24c3 0 5 1 7 4l4 5h35c4 0 7 3 7 7v7H14V18Z" />
                  <path class="standard-folder-body" d="M9 31c0-4 3-7 7-7h80c4 0 7 3 7 7l-6 36c-1 4-4 7-8 7H23c-4 0-7-3-8-7L9 31Z" />
                  <circle class="standard-folder-plus-bg" cx="56" cy="50" r="17" />
                  <path class="standard-folder-plus" d="M56 41v18M47 50h18" />
                </svg>
                <div class="muted">点击上传或将标准 PDF 拖拽到此区域</div>
                <button id="uploadStandards" class="upload-primary" type="button">上传标准 PDF</button>
              </div>
              <div id="standardUploadInfo" class="muted">等待上传 PDF。</div>
              <div class="progress"><div id="standardUploadProgressBar"></div></div>
              <h2 class="video-panel-title standard-directory-title">标准目录</h2>
              <div class="video-directory-tools">
                <div class="video-search-box standard-search-box">
                  <div class="video-search-input-wrap">
                    <input id="standardDirectorySearch" class="video-search" placeholder="输入标准名称关键词" />
                    <button id="standardSearchClear" class="search-clear-button hidden" type="button" aria-label="清空搜索">
                      <svg viewBox="0 0 20 20" aria-hidden="true">
                        <path d="m6.5 6.5 7 7m0-7-7 7" />
                      </svg>
                    </button>
                  </div>
                  <button id="standardSearchButton" class="search-icon-button" type="button" aria-label="搜索标准">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="7" />
                      <path d="m16.5 16.5 4 4" />
                    </svg>
                  </button>
                </div>
                <button id="standardLatestUpload" class="secondary sort-button" type="button">按最新时间排序</button>
              </div>
              <div id="standardList" class="list video-list standard-list"></div>
            </div>
          </div>
          <div class="standard-detail-page hidden">
            <div class="standard-detail-titlebar">
              <button id="backToStandardDirectory" class="secondary standard-back-button" type="button">返回标准目录</button>
              <h2 class="video-panel-title">标准详情</h2>
            </div>
            <div id="standardDetail" class="panel video-analysis-panel standard-detail-panel">
              <div class="empty">请选择标准查看解析进度与 Markdown 产物</div>
            </div>
          </div>
        </div>
      </section>

      <section id="standardSearch" class="view">
        <div class="standard-search-workspace" data-standard-search-view="home">
          <div class="standard-search-home-page">
            <div class="search-workspace standard-search-panel standard-search-controls">
              <h2 class="video-panel-title">标准检索</h2>
              <textarea id="standardSearchText" placeholder="粘贴视频分析文本，或输入待匹配的作业场景、对象、工序、风险点。"></textarea>
              <div class="toolbar standard-search-actions">
                <button id="searchStandards">检索标准</button>
              </div>
              <div class="standard-progress">
                <div id="standardSearchInfo" class="muted" data-standard-search-info>等待输入检索文本。</div>
                <div class="progress"><div id="standardSearchProgressBar" data-standard-search-progress-bar></div></div>
              </div>
              <div class="standard-search-subsection">
                <h2 class="video-panel-title">重建向量索引</h2>
                <button id="rebuildStandardIndex" class="secondary">重建向量索引</button>
              </div>
              <div class="standard-progress">
                <div id="standardIndexInfo" class="muted">等待重建向量索引。</div>
                <div class="progress"><div id="standardIndexProgressBar"></div></div>
              </div>
              <div id="standardIndexResult" class="panel compact-panel">暂无向量索引记录</div>
              <div class="history-header">
                <h3>检索历史</h3>
                <button id="reloadStandardSearchHistory" class="secondary small">刷新历史</button>
              </div>
              <div id="standardSearchHistory" class="panel compact-panel">暂无检索历史</div>
            </div>
          </div>
          <div class="standard-search-result-page hidden">
            <div class="standard-search-result-titlebar">
              <button id="backToStandardSearchHome" class="secondary standard-search-back-button" type="button">返回标准检索</button>
              <h2 class="video-panel-title">检索结果</h2>
            </div>
            <div class="search-workspace standard-search-panel standard-search-results">
              <textarea id="standardSearchResultText" placeholder="粘贴视频分析文本，或输入待匹配的作业场景、对象、工序、风险点。"></textarea>
              <div class="toolbar standard-search-actions">
                <button id="searchStandardsFromResult">重新检索</button>
              </div>
              <div class="standard-progress">
                <div id="standardSearchResultInfo" class="muted" data-standard-search-info>等待输入检索文本。</div>
                <div class="progress"><div id="standardSearchResultProgressBar" data-standard-search-progress-bar></div></div>
              </div>
              <div id="standardSearchResult" class="panel standard-search-result-panel">暂无检索结果</div>
            </div>
          </div>
        </div>
      </section>

      <section id="logs" class="view">
        <div id="logList" class="table-wrap"></div>
      </section>

    </main>
    <script src="/static/assets/app.js?v=20260720-model-detail-links"></script>
  </body>
</html>
