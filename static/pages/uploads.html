<section x-data="uploadsPage" class="h-full min-h-0 flex flex-col page-panel">
  <div class="flex-1 min-h-0 overflow-auto">
    <div class="px-4 py-4 border-b border-slate-800 flex items-center gap-3">
<span class="material-symbols-rounded text-orange-400" aria-hidden="true">route</span>
<p class="text-slate-400 text-xs leading-6">上传视频 <span class="mx-2">→</span> 结构化转写 <span class="mx-2">→</span> 业务帧匹配 <span class="mx-2">→</span> Markdown</p>
</div>
    <div class="px-4 py-6 sm:py-8">
      <label for="video-title" class="block mb-2 font-medium">视频标题 <span class="text-slate-400 font-normal text-xs">（可选，默认使用文件名）</span>
</label>
      <input id="video-title" x-model="title" :disabled="upload.busy" class="form-input w-full" maxlength="255" placeholder="为视频添加一个易于查找的名称">
      <div class="upload-zone mt-6" :class="dragging ? 'upload-zone-active' : ''" @dragover.prevent="dragging = !upload.busy" @dragleave.prevent="dragging = false" @drop.prevent="if (!upload.busy) drop($event)">
        <span class="material-symbols-rounded text-orange-400 text-[36px] mb-4" aria-hidden="true">cloud_upload</span>
        <h3 class="text-base font-medium">上传一段操作视频</h3>
<p class="text-slate-400 mt-2 mb-5 text-xs">拖拽文件到此处，或选择本地视频文件</p>
        <input id="video-file" x-ref="file" type="file" accept="video/*,.mp4,.mov,.webm,.m4v,.mkv" class="sr-only" tabindex="-1" :disabled="upload.busy" @change="select($event.target.files[0]); $event.target.value = ''" aria-label="选择视频文件">
        <button class="btn-primary" :disabled="upload.busy" @click="$refs.file.click()">
<span class="material-symbols-rounded" aria-hidden="true">add</span>
<span x-text="upload.busy ? '上传与解析进行中' : '选择视频并开始解析'">
</span>
</button>
        <p class="mt-4 text-[11px] text-slate-400">MP4 · MOV · WebM · M4V · MKV</p>
      </div>
      <p x-show="error" x-text="error" class="error-message mt-4" role="alert">
</p>
    </div>
    <div x-show="upload.id" class="border-y border-slate-800 px-4 py-5 bg-slate-900/40" aria-live="polite">
      <div class="flex items-start gap-3">
<span class="material-symbols-rounded text-slate-400" aria-hidden="true">description</span>
<div class="flex-1 min-w-0">
<h3 class="font-medium break-all" x-text="upload.filename">
</h3>
<p class="text-xs text-slate-400 mt-2" x-text="upload.message">
</p>
</div>
<span class="font-mono text-xs" x-show="!upload.indeterminate" x-text="upload.percent + '%'">
</span>
</div>
      <div class="progress-track mt-4" role="progressbar" aria-label="上传与解析进度" :aria-valuenow="upload.indeterminate ? null : upload.percent" aria-valuemin="0" aria-valuemax="100">
<div :class="upload.indeterminate ? 'indeterminate' : upload.error ? 'progress-failed' : upload.percent === 100 && !upload.busy ? 'progress-complete' : ''" :style="'width:' + (upload.indeterminate ? 100 : upload.percent) + '%' ">
</div>
</div>
      <p x-show="upload.error" x-text="upload.error" class="error-message mt-3" role="alert">
</p>
      <div class="flex items-center justify-between flex-wrap gap-3 mt-4">
<p class="text-xs text-slate-400 leading-6">关闭抽屉不会中断上传与解析；请勿关闭或刷新浏览器。</p>
<button class="btn-secondary" x-show="upload.registered" @click="openResult()">查看任务与解析结果<span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
</button>
</div>
    </div>
    <div class="px-4 py-5 text-xs leading-6 text-slate-400">
<h3 class="font-medium text-slate-300 mb-1">开始前须知</h3>
<p>选择文件后将立即上传并自动执行完整解析。解析时间取决于视频长度及模型处理速度。</p>
<p>上传请求暂时断开不代表后台任务失败，工作台会继续查询任务状态。</p>
</div>
  </div>
</section>
