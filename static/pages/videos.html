<section x-data="videosPage" class="h-full min-h-0 flex flex-col page-panel">
  <template x-if="!id">
<div class="h-full min-h-0 flex flex-col">
    <div class="page-heading shrink-0">
<div>
<h2 x-ref="listHeading" tabindex="-1">文件解析</h2>
<p>从操作视频中提取可查阅、可复用的知识。</p>
</div>
</div>
    <div id="video-filters" class="shrink-0 flex items-center gap-2 px-4 py-3 border-b border-slate-800">
<div class="flex flex-1 min-w-0 items-center gap-2 overflow-x-auto whitespace-nowrap" role="group" aria-label="文件解析搜索与筛选" tabindex="0">
<label class="sr-only" for="video-search">搜索视频标题或文件名</label>
<div class="relative flex-1 min-w-48">
<span class="material-symbols-rounded absolute left-3 top-3 text-slate-400" aria-hidden="true">search</span>
<input id="video-search" class="form-input h-11 w-full pl-10" placeholder="搜索视频标题或文件名…" maxlength="200" x-model.debounce.300ms="query">
</div>
<label class="sr-only" for="video-status">视频状态</label>
<select id="video-status" class="form-input h-11 shrink-0" x-model="status">
<option value="">全部状态</option>
<template x-for="option in videoStatusOptions" :key="option.value">
<option :value="option.value" :selected="status === option.value" x-text="option.label"></option>
</template>
</select>
<label class="sr-only" for="video-sort">时间排序</label>
<select id="video-sort" class="form-input h-11 shrink-0" x-model="sort">
<option value="desc">最新上传</option>
<option value="asc">最早上传</option>
</select>
</div>
<button id="upload-video-button" class="btn-primary h-11 min-w-11 shrink-0" @click="$dispatch('psop:upload-open')" aria-haspopup="dialog" aria-controls="upload-drawer" :aria-label="$store.app.upload.busy ? '查看上传进度' : '上传视频'">
<span class="material-symbols-rounded" aria-hidden="true">add</span>
<span class="hidden sm:inline" x-text="$store.app.upload.busy ? '查看上传进度' : '上传视频'"></span>
</button>
</div>
    <p x-show="listError && !loading && !error" x-text="listError" class="shrink-0 px-4 py-2 text-xs text-amber-300" role="status"></p>
    <div x-ref="listRegion" class="flex-1 min-h-0 overflow-auto" role="region" aria-label="文件解析列表，可横向滚动查看全部字段" :aria-busy="loading" tabindex="0">
      <div x-show="loading" class="p-4" role="status">
<div class="skeleton h-20 mb-3">
</div>
<div class="skeleton h-20 mb-3">
</div>
<div class="skeleton h-20">
</div>
<span class="sr-only">正在加载文件解析</span>
</div>
      <div x-show="error && !loading" class="empty-state" role="alert">
<span class="material-symbols-rounded text-rose-300" aria-hidden="true">cloud_off</span>
<h3>无法加载文件解析</h3>
<p x-text="error">
</p>
<button class="btn-secondary" @click="refresh()">重新加载</button>
</div>
      <div x-show="!loading && !error && !items.length" class="empty-state">
<span class="material-symbols-rounded" aria-hidden="true">video_library</span>
<h3 x-text="query || status ? '没有匹配的视频' : '视频知识，从这里开始'">
</h3>
<p x-text="query || status ? '调整搜索词或状态筛选，再试一次。' : '上传第一段操作视频，自动生成转写、业务帧与 Markdown。'">
</p>
<button x-show="!query && !status" class="btn-primary mt-2" @click="$dispatch('psop:upload-open')" aria-haspopup="dialog" aria-controls="upload-drawer">上传视频</button>
</div>
      <table x-show="!loading && !error && items.length" class="data-table video-table">
        <caption class="sr-only">文件解析列表</caption>
        <colgroup><col><col class="w-44"><col class="w-24"><col class="w-20"><col class="w-52"><col class="w-20"></colgroup>
        <thead>
          <tr><th scope="col">文件名称</th><th scope="col">上传时间（北京时间）</th><th scope="col">大小</th><th scope="col">帧数</th><th scope="col">状态</th><th scope="col" class="video-actions">操作</th></tr>
        </thead>
        <tbody>
          <template x-for="video in items" :key="video.id">
            <tr class="video-row">
              <td>
                <a :href="'/videos/' + encodeURIComponent(video.id)" @click.prevent="open(video)" class="flex items-center gap-3 min-w-0 hover:text-orange-200" :title="video.title || video.filename">
                  <span class="material-symbols-rounded text-slate-400 shrink-0" aria-hidden="true">movie</span>
                  <span class="truncate font-medium" x-text="video.title || video.filename"></span>
                </a>
              </td>
              <td class="font-mono tabular-nums text-[11px] text-slate-400" x-text="formatDate(video.created_at)"></td>
              <td class="font-mono tabular-nums text-xs text-slate-400" x-text="formatBytes(video.size_bytes)"></td>
              <td class="font-mono tabular-nums text-xs text-slate-400" x-text="video.frame_count || 0"></td>
              <td><span class="badge" :class="tone(video.status)" x-text="listStatusLabel(video)"></span></td>
              <td class="video-actions">
                <button class="delete-file-button icon-button" @click="confirmDelete(video)" :disabled="!canDelete(video) || deleteBusy" :aria-label="'删除 ' + (video.title || video.filename)" :title="canDelete(video) ? '删除文件及解析产物' : '上传或解析中的视频不能删除'" aria-haspopup="dialog" aria-controls="delete-video-dialog">
                  <span class="material-symbols-rounded" aria-hidden="true">delete</span>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <nav class="shrink-0 flex items-center justify-end gap-2 border-t border-slate-800 px-4 py-3 text-xs text-slate-400" aria-label="文件解析分页">
      <label class="sr-only" for="video-page-size">每页条数</label>
      <select id="video-page-size" class="form-input h-11 text-xs shrink-0" x-model.number="pageSize" :disabled="deleteBusy">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
        <option value="100">100 条/页</option>
      </select>
      <span class="font-mono tabular-nums whitespace-nowrap" role="status" aria-live="polite" x-text="loading ? '加载中…' : error ? '未加载' : '第 ' + page + ' / ' + totalPages + ' 页'"></span>
      <button class="icon-button w-11 h-11 shrink-0" @click="changePage(page - 1)" :disabled="loading || !!error || deleteBusy || page <= 1" aria-label="上一页" title="上一页">
        <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
      </button>
      <button class="icon-button w-11 h-11 shrink-0" @click="changePage(page + 1)" :disabled="loading || !!error || deleteBusy || page >= totalPages" aria-label="下一页" title="下一页">
        <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
      </button>
    </nav>
  </div>
</template>
  <template x-if="id">
<div class="h-full min-h-0 flex flex-col">
    <div class="shrink-0 px-4 py-3 border-b border-slate-800 flex items-center gap-3">
<button class="icon-button shrink-0" @click="go('/videos')" aria-label="返回文件解析">
<span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
</button>
<h2 class="font-medium truncate flex-1 min-w-0" x-text="job?.title || job?.filename || '视频分析'">
</h2>
<span id="detail-status" x-show="job" class="badge shrink-0 max-w-[60%] gap-2" :class="tone(job?.status)" :title="job?.status === 'processing' ? progressLabel(job) : statusLabel(job)" :aria-label="statusLabel(job) + (stageCount(job) ? '，当前阶段 ' + stageCount(job) : '')" role="status" aria-live="polite" aria-atomic="true">
<span class="truncate" x-text="statusLabel(job)">
</span>
<span x-show="stageCount(job)" class="shrink-0 font-mono tabular-nums tracking-normal" x-text="stageCount(job)">
</span>
</span>
</div>
    <div x-show="loading" class="p-4" role="status">
<div class="skeleton h-16 mb-3">
</div>
<div class="skeleton h-48">
</div>
<span class="sr-only">正在加载解析结果</span>
</div>
    <div x-show="error && !loading" class="empty-state" role="alert">
<p x-text="error">
</p>
<button class="btn-secondary" @click="loadDetail()">重试</button>
</div>
    <div x-show="!loading && !error && job" class="flex-1 min-h-0 flex flex-col">
      <div class="shrink-0 border-b border-slate-800 px-4 py-3 flex flex-wrap gap-3 items-center">
        <div class="flex flex-wrap items-center gap-3 min-w-0 max-w-full">
        <div class="copy-field w-full sm:w-48">
<input readonly aria-label="视频任务 ID" :value="id" @focus="$event.target.select()">
<button @click="copy(id, 'id')" :aria-label="copied === 'id' ? '任务 ID 已复制' : '复制任务 ID'">
<span class="material-symbols-rounded" aria-hidden="true" x-text="copied === 'id' ? 'check' : 'content_copy'">
</span>
</button>
</div>
        <span class="text-xs font-mono text-slate-400 whitespace-nowrap" x-text="formatBytes(job?.size_bytes)">
</span>
<span class="text-xs font-mono text-slate-400 whitespace-nowrap" x-text="formatDate(job?.created_at)">
</span>
        </div>
        <div class="flex items-center gap-2 min-w-0 max-w-full overflow-x-auto whitespace-nowrap sm:ml-auto" role="group" aria-label="解析与导出操作" tabindex="0">
<button class="btn-primary shrink-0" @click="parse('full')" :disabled="busy" title="重新生成转写文本、业务帧和 Markdown，更新已有解析结果">
<span class="material-symbols-rounded" aria-hidden="true">refresh</span>重新解析</button>
<button class="btn-secondary shrink-0" @click="parse('transcript')" :disabled="busy" title="重新进行语音转写和结构化整理，更新已有转写文本">重新转写</button>
<button class="btn-secondary shrink-0" @click="parse('keyframes')" :disabled="busy" title="根据现有转写重新抽取和筛选业务帧，替换已有业务帧结果">重新抽帧</button>
<button class="btn-secondary shrink-0" @click="parse('markdown')" :disabled="busy" title="根据现有转写和业务帧重新生成 Markdown，更新已有文档">重新生成 Markdown</button>
        <button class="btn-secondary shrink-0" @click="exportResult()" :disabled="exportBusy || !job || busy">
<span class="material-symbols-rounded" aria-hidden="true">download</span>
<span x-text="exportBusy ? '正在导出' : '导出产物'">
</span>
</button>
        </div>
      </div>
      <div id="detail-feedback" x-show="pollError || job?.error_message || parseError" class="shrink-0 px-4 py-3 border-b border-slate-800 flex flex-col gap-1" aria-live="polite">
<p x-show="pollError" x-text="pollError" class="text-xs text-amber-300 leading-6">
</p>
<p x-show="job?.error_message" x-text="job?.error_message" class="error-message">
</p>
<p x-show="parseError" x-text="parseError" class="error-message">
</p>
</div>
      <div class="shrink-0 flex border-b border-slate-800 px-4 gap-5 overflow-x-auto" role="tablist" aria-label="解析结果">
<template x-for="item in artifactTabs" :key="item.key">
<button role="tab" class="result-tab" :class="tab === item.key ? 'result-tab-active' : ''" :aria-selected="tab === item.key" @click="changeTab(item.key)" x-text="item.label">
</button>
</template>
</div>
      <div class="flex-1 min-h-0 overflow-auto flex flex-col" role="tabpanel" :aria-label="tab">
        <div x-show="artifactLoading" class="p-4" role="status">
<div class="skeleton h-48">
</div>
<span class="sr-only">正在读取产物</span>
</div>
        <div x-show="artifactError && !artifactLoading" class="empty-state" role="alert">
<p x-text="artifactError">
</p>
<button class="btn-secondary" @click="loadArtifact()">重新读取</button>
</div>
        <div x-show="!artifactLoading && !artifactError" class="flex-1 min-h-0 flex flex-col">
          <div x-show="tab === 'transcript'" class="h-full min-h-0 flex flex-col">
<div class="artifact-toolbar">
<h3>最新结构化转写</h3>
<button class="btn-secondary" @click="copy(transcript, 'transcript')" :disabled="!transcript">
<span class="material-symbols-rounded" aria-hidden="true" x-text="copied === 'transcript' ? 'check' : 'content_copy'">
</span>复制</button>
</div>
<textarea x-show="transcript" readonly :value="transcript" class="text-editor flex-1 min-h-48" aria-label="最新结构化转写">
</textarea>
<div x-show="!transcript" class="empty-state">
<h3>暂无结构化转写</h3>
<p>点击“重新转写”生成文本，或点击“重新解析”生成全部解析结果。</p>
</div>
</div>
          <div x-show="tab === 'markdown'" class="markdown-pane">
<div class="markdown-actions" role="group" aria-label="Markdown 操作">
<button class="btn-quiet" :aria-pressed="!source" aria-controls="markdown-preview" :class="!source ? 'text-orange-200 bg-orange-500/10' : ''" @click="source = false">预览</button>
<button class="btn-quiet" :aria-pressed="source" aria-controls="markdown-source" :class="source ? 'text-orange-200 bg-orange-500/10' : ''" @click="source = true">源码</button>
<button class="btn-quiet" @click="copy(markdown, 'markdown')" :disabled="!markdown" :aria-label="copied === 'markdown' ? 'Markdown 已复制' : '复制 Markdown'">
<span class="material-symbols-rounded" aria-hidden="true" x-text="copied === 'markdown' ? 'check' : 'content_copy'">
</span>复制</button>
</div>
<div id="markdown-preview" x-show="markdown && !source" x-html="renderedMarkdown" class="markdown-document markdown-content overflow-auto" role="region" aria-label="Markdown 预览" tabindex="0">
</div>
<textarea id="markdown-source" x-show="markdown && source" readonly :value="markdown" class="text-editor markdown-content overflow-auto" aria-label="Markdown 源码">
</textarea>
<div x-show="!markdown" class="empty-state markdown-content overflow-auto">
<h3>暂无 Markdown</h3>
<p>生成结构化转写后，点击“重新生成 Markdown”。</p>
</div>
</div>
          <div x-show="tab === 'frames'" class="overflow-auto">
<div x-show="!sections.length" class="empty-state">
<h3>暂无业务帧结果</h3>
<p>请先生成结构化转写，再点击“重新抽帧”。</p>
</div>
<div class="divide-y divide-slate-800">
<template x-for="(section, sectionIndex) in sections" :key="sectionIndex">
<section class="px-4 py-5">
<div class="flex flex-wrap items-center justify-between gap-2 mb-3">
<h3 class="font-medium" x-text="(section.index || sectionIndex + 1) + '. ' + (section.title || '文本段落')">
</h3>
<span class="text-[11px] font-mono text-slate-400" x-text="(section.start_time || timestamp(section.start_seconds)) + ' — ' + (section.end_time || timestamp(section.end_seconds))">
</span>
</div>
<p class="text-xs leading-6 text-slate-300">
<span class="text-slate-400">润色后正文：</span>
<span x-text="section.polished_text || section.text || '未识别'">
</span>
</p>
<p class="text-xs leading-6 text-slate-400 mt-1">待匹配文本：<span x-text="section.business_frame_text || '未识别'">
</span>
</p>
<p class="text-xs text-slate-400 mt-4 mb-3">按匹配分数排序 · 最多展示 5 帧 <span class="font-mono" x-text="' / 候选总数 ' + (section.raw_frames_total ?? section.raw_frames?.length ?? 0)">
</span>
</p>
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-5 gap-4">
<template x-for="image in rankedFrames(section)" :key="image.id || image.object_key || image.url">
<figure class="min-w-0">
<button class="frame-image" @click="preview(image.url)" :disabled="!safeImageUrl(image.url)" :aria-label="'预览业务帧 ' + image.rank">
<img :src="safeImageUrl(image.url) || undefined" :alt="'业务帧 ' + (image.timestamp_time || timestamp(image.timestamp_seconds))" loading="lazy">
</button>
<figcaption class="py-3">
<div class="flex justify-between text-[11px] font-mono text-slate-300">
<span x-text="'#' + image.rank + ' ' + (image.timestamp_time || timestamp(image.timestamp_seconds))">
</span>
<span x-text="Number(image.score || 0).toFixed(4)">
</span>
</div>
<div class="score-track mt-2">
<div :style="'width:' + Math.max(0, Math.min(100, Number(image.score || 0) * 100)) + '%' ">
</div>
</div>
<div class="flex flex-wrap gap-2 mt-3">
<button class="btn-secondary text-xs" :disabled="!image.mask_image" @click="preview('data:image/jpeg;base64,' + image.mask_image)">查看 mask</button>
<button x-show="image.bbox_image" class="btn-secondary text-xs" @click="preview('data:image/jpeg;base64,' + image.bbox_image)">查看 bbox</button>
</div>
</figcaption>
</figure>
</template>
</div>
<p x-show="!rankedFrames(section).length" class="text-slate-400 text-xs py-5">该段落暂无业务帧匹配结果。</p>
</section>
</template>
</div>
</div>
        </div>
      </div>
    </div>
  </div>
</template>
  <dialog id="delete-video-dialog" x-ref="deleteDialog" class="confirm-dialog" aria-labelledby="delete-video-title" aria-describedby="delete-video-description"
    @cancel.prevent="closeDelete()" @click="if ($event.target === $el) closeDelete()" @close="afterDeleteClose()" @keydown.tab="trapDeleteFocus($event)">
    <div class="p-5">
      <h2 id="delete-video-title" class="text-base font-semibold">删除这个视频？</h2>
      <p class="mt-3 text-sm font-medium break-all" x-text="deleteTarget?.title || deleteTarget?.filename"></p>
      <p id="delete-video-description" class="mt-2 text-xs leading-6 text-slate-400">将删除源视频、解析产物及任务记录，操作不可撤销。历史用量记录会保留。</p>
      <p x-show="deleteError" x-text="deleteError" class="error-message mt-3" role="alert"></p>
      <p x-show="deleteBusy" class="mt-3 text-xs text-slate-400" role="status">正在删除文件与解析产物，请稍候…</p>
      <div class="mt-5 flex justify-end gap-3">
        <button class="btn-secondary" @click="closeDelete()" :disabled="deleteBusy" autofocus>取消</button>
        <button class="btn-danger" @click="deleteConfirmed()" :disabled="deleteBusy" x-text="deleteBusy ? '正在删除…' : '确认删除'"></button>
      </div>
    </div>
  </dialog>
</section>
